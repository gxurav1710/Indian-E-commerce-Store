<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Cancelled · YOUPI Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #111c34;
      --border: #1e293b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: #060a12;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      color: #38bdf8;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    main { max-width: 640px; width: 100%; margin: 2rem auto; padding: 1.5rem; flex: 1; }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
    }

    .status-icon-wrap {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(148, 163, 184, 0.15);
      border: 2px solid #64748b;
      color: #cbd5e1;
      font-size: 2.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem auto;
    }

    .result-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.85rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .result-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    .details-table {
      background: #070d18;
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      padding: 1.25rem;
      margin-bottom: 2rem;
      text-align: left;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.9rem;
    }

    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--text-muted); font-weight: 500; }
    .detail-val { color: #ffffff; font-weight: 700; font-family: monospace; font-size: 0.95rem; }

    .btn-row { display: flex; gap: 0.85rem; }
    .btn {
      flex: 1;
      padding: 0.85rem 1.25rem;
      border-radius: 0.65rem;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--primary); color: #ffffff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #1e293b; color: #f8fafc; border: 1px solid var(--border); }
    .btn-secondary:hover { background: #334155; }
  </style>
</head>
<body>

<header>
  <a href="/" class="brand">
    <span>⚡ YOUPI Store</span>
  </a>
  <span style="font-size: 0.82rem; color: #64748b; font-weight: 600;">Reference Implementation Demo</span>
</header>

<main>
  <div class="result-card">
    <div class="status-icon-wrap">⊘</div>
    <h1 class="result-title">Payment Cancelled</h1>
    <p class="result-subtitle">The checkout window was dismissed before completing the transaction. No charges were made to your account.</p>

    <div class="details-table">
      <div class="detail-row">
        <span class="detail-label">Order ID</span>
        <span class="detail-val" id="valOrderId">{{ORDER_ID}}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Status</span>
        <span class="detail-val" style="color: #94a3b8;">CANCELLED</span>
      </div>
    </div>

    <div class="btn-row">
      <a href="/" class="btn btn-primary">Return to Store</a>
      <a href="/wallet" class="btn btn-secondary">Check Wallet</a>
    </div>
  </div>
</main>

<script>
  const params = new URLSearchParams(window.location.search);
  if (params.get('order_id') || params.get('orderId')) {
    const oId = params.get('order_id') || params.get('orderId');
    const el = document.getElementById('valOrderId');
    if (el && (el.textContent === '{{ORDER_ID}}' || !el.textContent)) el.textContent = oId;
  }
</script>

</body>
</html>
